name: Flipkart Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Verify scraper imports
        run: python -c "from scrapling.fetchers import Fetcher; from src.scraper.flipkart_scraper import scrape_and_store; print('imports ok')"

      - name: Run Flipkart scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape_runner.py --max-pages 30
